# Validates data on every pull request. Uses `pull_request` (not `pull_request_target`)
# with read-only permissions, so code from forks never runs with secrets or write access.
# Errors fail the check; warnings appear as annotations on the PR's "Files changed" tab
# and in the run summary (a read-only token cannot post PR comments on fork PRs).
name: Validate data

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # the PR merge commit and its base parent
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests for the validator
        run: npm test

      - name: List files changed by this pull request
        if: github.event_name == 'pull_request'
        run: git diff --name-only HEAD^1 HEAD | tee changed-files.txt

      - name: Validate (pull request)
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        # Maintainers are read from CODEOWNERS on the base commit (HEAD^1), so a PR cannot add its own author.
        run: npm run validate -- --changed-files changed-files.txt --base-ref HEAD^1 --actor "$PR_AUTHOR" --check-urls

      - name: Validate (main)
        if: github.event_name == 'push'
        run: npm run validate
