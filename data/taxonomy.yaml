# data/taxonomy.yaml
# Categories and sub-tags shared by every city.
# A startup picks one `category` and 1-5 `tags` from that category's list.
# `colour` is the pin/chip colour on the map.
# To propose a new tag, open a PR editing this file with a one-line reason.

categories:
